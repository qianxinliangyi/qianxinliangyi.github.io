<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自制纸娃娃模拟器</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body{
  background:#f7f3f9;
  padding:12px;
}
.wrap{
  max-width:480px;
  margin:0 auto;
}
/* 重点：抛弃 aspect-ratio，改用padding百分比固定4:5容器 */
.doll-canvas{
  position:relative;
  width:100%;
  padding-top: 125%; /* 4:5 宽高比 5/4=1.25 */
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:16px;
  -webkit-transform: translateZ(0); /* 开启GPU合成层，修复Safari渲染丢失 */
  transform: translateZ(0);
}
.doll-canvas img{
  position:absolute;
  inset:0;
  margin:auto;
  width:85%;
  pointer-events:none;
  opacity:1;
  -webkit-backface-visibility: visible;
  backface-visibility: visible;
}
.doll-canvas img.hidden-layer{
  opacity:0;
  pointer-events:none;
}
.layer-bg      { z-index:1; }
.layer-body    { z-index:2; }
.layer-eye     { z-index:3; }
.layer-hairback{ z-index:4; }
.layer-cloth   { z-index:5; }
.layer-bottom  { z-index:6; }
.layer-acc     { z-index:7; }

.panel{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
}
.group-title{
  width:100%;
  font-size:15px;
  color:#666;
  margin-top:8px;
}
button{
  padding:12px 14px;
  border:none;
  border-radius:12px;
  background:#e8d8ef;
  color:#333;
  font-size:14px;
  min-width:70px;
}
button.active{
  background:#b88fc9;
  color:#fff;
}
.btn-action{
  background:#7a4291;
  color:white;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="doll-canvas" id="canvas">
    <img class="layer-bg" id="imgBg" src="img/bg1.png">
    <img class="layer-body" id="imgBody" src="img/body.png">
    <img class="layer-eye" id="imgEye" src="img/eye1.png">
    <img class="layer-hairback" id="imgHairBack" src="img/hair_back1.png">
    <img class="layer-cloth" id="imgCloth" src="img/cloth1.png">
    <img class="layer-bottom" id="imgBottom" src="img/bottom1.png">
    <img class="layer-acc" id="imgAcc" src="img/acc_none.png">
  </div>

  <div class="panel">
    <div class="group-title">眼睛</div>
    <button onclick="setEye('img/eye1.png')" class="active">眼1</button>
    <button onclick="setEye('img/eye2.png')">眼2</button>
    <button onclick="setEye('none')">隐藏</button>

    <div class="group-title">后发</div>
    <button onclick="setHairBack('img/hair_back1.png')" class="active">后发1</button>
    <button onclick="setHairBack('img/hair_back2.png')">后发2</button>
    <button onclick="setHairBack('none')">隐藏</button>

    <div class="group-title">上衣/连衣裙</div>
    <button onclick="setCloth('img/cloth1.png')" class="active">上衣/连衣裙1</button>
    <button onclick="setCloth('img/cloth2.png')">上衣/连衣裙2</button>
    <button onclick="setCloth('none')">隐藏</button>

    <div class="group-title">下装</div>
    <button onclick="setBottom('img/bottom1.png')" class="active">下装1</button>
    <button onclick="setBottom('img/bottom2.png')">下装2</button>
    <button onclick="setBottom('none')">隐藏</button>

    <div class="group-title">配饰</div>
    <button onclick="setAcc('img/acc1.png')">配饰1</button>
    <button onclick="setAcc('none')" class="active">无配饰</button>
  </div>

  <div class="panel">
    <button class="btn-action" onclick="resetAll()">🔄 重置</button>
    <button class="btn-action" onclick="saveScreenshot()">📷 截图保存</button>
  </div>
</div>

<!-- 先注释掉html2canvas，它是iOS Safari渲染干扰元凶！等图片正常了再打开 -->
<!-- <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script> -->
<script>
function setSrc(elId, src){
  const el = document.getElementById(elId);
  if(src === 'none'){
    el.classList.add('hidden-layer');
  }else{
    el.classList.remove('hidden-layer');
    el.src = src;
  }
}

function setEye(s){ setSrc('imgEye',s); }
function setHairBack(s){ setSrc('imgHairBack',s); }
function setCloth(s){ setSrc('imgCloth',s); }
function setBottom(s){ setSrc('imgBottom',s); }
function setAcc(s){ setSrc('imgAcc',s); }

function resetAll(){
  setEye('img/eye1.png');
  setHairBack('img/hair_back1.png');
  setCloth('img/cloth1.png');
  setBottom('img/bottom1.png');
  setAcc('img/acc_none.png');
}

</script>
</body>
</html>
